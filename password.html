<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Judy Lee — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --linen:#FEFCF9;--sand:#D9C9B0;--wg:#6B6560;--lg:#C4BDB6;
    --slate:#4A72A0;--obs:#1A1612;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'DM Sans',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--linen);font-family:var(--sans);font-weight:300;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:2rem;
  }
  .wrap{
    display:flex;flex-direction:column;align-items:center;
    gap:2rem;animation:fadeUp 0.8s ease both;
  }
  .logo{display:flex;flex-direction:column;align-items:center;}
  .logo-text{
    font-family:var(--serif);font-size:14px;font-weight:300;
    letter-spacing:0.28em;text-transform:uppercase;color:var(--obs);line-height:1;
  }
  .logo-rule{width:100%;height:1px;background:var(--slate);margin-top:5px;}
  .field{display:flex;flex-direction:column;align-items:center;gap:0.75rem;width:260px;}
  .pw-input{
    width:100%;padding:0.75rem 1rem;
    background:var(--linen);border:1px solid var(--sand);
    font-family:var(--sans);font-size:14px;font-weight:300;
    color:var(--obs);outline:none;transition:border-color 0.2s;
    letter-spacing:0.1em;text-align:center;border-radius:0;
  }
  .pw-input:focus{border-color:var(--slate);}
  .pw-input.error{border-color:#C0392B;animation:shake 0.35s ease;}
  .pw-input::placeholder{color:var(--lg);letter-spacing:0.06em;}
  .submit-btn{
    width:100%;padding:0.75rem;background:var(--obs);color:var(--linen);
    border:none;font-family:var(--sans);font-size:10px;font-weight:500;
    letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;
    transition:opacity 0.2s;border-radius:0;
  }
  .submit-btn:hover{opacity:0.8;}
  .err{
    font-size:11px;color:#C0392B;letter-spacing:0.04em;
    opacity:0;transition:opacity 0.2s;height:14px;
  }
  .err.show{opacity:1;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <span class="logo-text">JL</span>
    <span class="logo-rule"></span>
  </div>
  <div class="field">
    <input type="password" class="pw-input" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
    <p class="err" id="err">Incorrect password</p>
    <button class="submit-btn" id="btn" type="button">Enter</button>
  </div>
</div>
<script>
  var CORRECT='jlee2026',KEY='jl_auth';
  if(sessionStorage.getItem(KEY)==='1'){window.location.replace('index.html');}
  var input=document.getElementById('pw'),btn=document.getElementById('btn'),err=document.getElementById('err');
  function attempt(){
    if(input.value.trim()===CORRECT){sessionStorage.setItem(KEY,'1');window.location.replace('index.html');}
    else{input.classList.add('error');err.classList.add('show');input.value='';input.focus();setTimeout(function(){input.classList.remove('error');},400);}
  }
  btn.addEventListener('click',attempt);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')attempt();err.classList.remove('show');});
</script>
</body>
</html>
